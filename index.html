<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alba Laguna · Designing T-Shirts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f4efe6;
    --canvas-2:#efe7d8;
    --ink:#2a2330;
    --magenta:#e01f7a;
    --orange:#f6921e;
    --yellow:#fbc02d;
    --green:#5db94a;
    --thread:#d8cdb8;
    --card:#fffdf9;
    --gold:#c9972e;
    --gold-light:#e8bb52;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(224,31,122,0.10), transparent 40%),
      radial-gradient(circle at 90% 12%, rgba(91,185,74,0.12), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(246,146,30,0.12), transparent 40%),
      var(--canvas);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(224,31,122,0.10), transparent 40%),
      radial-gradient(circle at 90% 12%, rgba(91,185,74,0.12), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(246,146,30,0.12), transparent 40%),
      repeating-linear-gradient(0deg, rgba(42,35,48,0.025) 0px, rgba(42,35,48,0.025) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(42,35,48,0.025) 0px, rgba(42,35,48,0.025) 1px, transparent 1px, transparent 3px),
      var(--canvas);
    font-family:'Poppins', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:36px 16px 60px;
  }

  .page{
    width:100%;
    max-width:420px;
  }

  /* ---------- LOGO / HEADER ---------- */
  .brandmark{
    position:relative;
    width:210px;
    height:210px;
    margin:0 auto 6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* rotating paint-splash halo, echoes the logo's own arc */
  .halo{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    pointer-events:none;
    background:conic-gradient(from 0deg,
      var(--magenta) 0deg, var(--orange) 90deg, var(--yellow) 150deg,
      transparent 175deg, transparent 185deg,
      var(--green) 210deg, var(--yellow) 270deg, var(--magenta) 340deg, var(--magenta) 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
    opacity:0;
    animation:haloIn .8s ease-out forwards, spin 14s linear infinite;
    animation-delay:.1s, .9s;
  }
  @keyframes haloIn{ to{ opacity:1; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* soft pulsing glow behind the logo */
  .glow{
    position:absolute;
    inset:6px;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle, rgba(246,146,30,0.25), transparent 70%);
    opacity:0;
    animation:glowIn 1s ease-out forwards, pulse 3.2s ease-in-out infinite;
    animation-delay:.2s, 1.2s;
  }
  @keyframes glowIn{ to{ opacity:1; } }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:.55; }
    50%{ transform:scale(1.08); opacity:.85; }
  }

  .logo-img{
    position:relative;
    width:172px;
    height:172px;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    box-shadow:0 12px 30px -8px rgba(201,151,46,0.55), 0 4px 12px -4px rgba(201,151,46,0.35);
    opacity:0;
    transform:scale(.7) rotate(-8deg);
    animation:logoPop .75s cubic-bezier(.22,1.3,.36,1) forwards;
    animation-delay:.55s;
  }
  @keyframes logoPop{
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .droplet{
    position:absolute;
    border-radius:50%;
    opacity:0;
    transform-origin:center;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop{
    0%{ opacity:0; transform:scale(0); }
    70%{ opacity:1; transform:scale(1.25); }
    100%{ opacity:1; transform:scale(1); }
  }

  .brand-name{
    font-family:'Sacramento', cursive;
    font-size:38px;
    text-align:center;
    line-height:1.15;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 10px rgba(201,151,46,0.25);
    margin:14px 0 0;
    opacity:0;
    animation:riseIn .7s ease-out forwards;
    animation-delay:1.05s;
  }
  .brand-sub{
    text-align:center;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:5px;
    color:var(--green);
    margin:10px 0 26px;
    opacity:0;
    animation:riseIn .7s ease-out forwards;
    animation-delay:1.2s;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .tagline{
    text-align:center;
    font-size:13.5px;
    color:#6b6072;
    max-width:280px;
    margin:0 auto 30px;
    opacity:0;
    animation:riseIn .7s ease-out forwards;
    animation-delay:1.3s;
  }

  /* ---------- PRESS LEVER BADGE ---------- */
  .press-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:fit-content;
    margin:0 auto 30px;
    padding:8px 16px 8px 12px;
    border-radius:999px;
    background:var(--card);
    border:1.5px solid var(--gold);
    box-shadow:0 4px 14px -8px rgba(201,151,46,0.5);
    opacity:0;
    animation:riseIn .7s ease-out forwards;
    animation-delay:1.32s;
  }
  .press-badge svg{ width:22px; height:22px; overflow:visible; }
  .press-badge span{
    font-family:'Fredoka', sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.5px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .lever-arm{
    transform-origin:83px 18px;
    animation:press 2.6s ease-in-out infinite;
    animation-delay:2s;
  }
  @keyframes press{
    0%, 20%{ transform:rotate(0deg); }
    32%{ transform:rotate(-34deg); }
    46%, 70%{ transform:rotate(0deg); }
    100%{ transform:rotate(0deg); }
  }
  .steam-mini{
    opacity:0;
    animation:steamRise 2.6s ease-out infinite;
    animation-delay:2.35s;
  }
  @keyframes steamRise{
    0%, 30%{ opacity:0; transform:translateY(0) scale(.6); }
    45%{ opacity:.9; }
    68%{ opacity:0; transform:translateY(-10px) scale(1.3); }
    100%{ opacity:0; }
  }

  /* ---------- STITCH DIVIDER ---------- */
  .stitch{
    height:1px;
    margin:26px auto;
    max-width:260px;
    background-image:repeating-linear-gradient(90deg, var(--thread) 0 8px, transparent 8px 14px);
    opacity:0;
    animation:riseIn .6s ease-out forwards;
    animation-delay:1.4s;
  }

  /* ---------- LINK PATCHES ---------- */
  .links{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .patch{
    --accent: var(--magenta);
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background:var(--card);
    border-radius:16px;
    border:2px dashed var(--accent);
    text-decoration:none;
    color:var(--ink);
    font-family:inherit;
    font-size:100%;
    text-align:left;
    cursor:pointer;
    box-shadow:0 6px 0 -2px rgba(42,35,48,0.06), 0 10px 22px -12px rgba(42,35,48,0.35);
    opacity:0;
    transform:translateY(18px);
    animation:slideUp .55s cubic-bezier(.22,1,.36,1) forwards;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    overflow:hidden;
  }
  .patch:nth-child(1){ --accent:var(--gold);    animation-delay:1.5s; }
  .patch:nth-child(2){ --accent:var(--magenta); animation-delay:1.62s; }
  .patch:nth-child(3){ --accent:var(--green);   animation-delay:1.74s; }
  .patch:nth-child(4){ --accent:var(--orange);  animation-delay:1.86s; }
  .patch:nth-child(5){ --accent:var(--yellow);  animation-delay:1.98s; }

  @keyframes slideUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .patch::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 15% 50%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%);
    opacity:0;
    transition:opacity .18s ease;
  }

  .patch:hover, .patch:focus-visible{
    transform:translateY(2px) scale(.98);
    box-shadow:0 2px 0 -1px rgba(42,35,48,0.06), 0 4px 10px -6px rgba(42,35,48,0.35);
    outline:none;
  }
  .patch:hover::before, .patch:focus-visible::before{ opacity:1; }
  .patch:active{ transform:translateY(4px) scale(.96); }

  .icon-wrap{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .icon-wrap svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; }
  .icon-wrap.fill svg{ fill:#fff; stroke:none; }

  /* steam wisp on hover, like a heat press releasing */
  .steam{
    position:absolute;
    top:-2px;
    left:50%;
    width:3px;
    height:3px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    opacity:0;
    pointer-events:none;
  }
  .patch:hover .steam{ animation:rise 1s ease-out forwards; }
  .patch:hover .steam:nth-of-type(2){ animation-delay:.15s; left:40%; }
  .patch:hover .steam:nth-of-type(3){ animation-delay:.3s; left:60%; }
  @keyframes rise{
    0%{ opacity:0; transform:translate(-50%,0) scale(.6); }
    30%{ opacity:.8; }
    100%{ opacity:0; transform:translate(-50%,-26px) scale(1.4); }
  }

  .patch-text{ display:flex; flex-direction:column; gap:1px; }
  .patch-title{ font-family:'Fredoka', sans-serif; font-weight:600; font-size:15.5px; }
  .patch-sub{ font-size:11.5px; color:#8a8091; }

  .go{
    margin-left:auto;
    flex:0 0 auto;
    width:26px; height:26px;
    color:var(--accent);
    transform:translateX(0);
    transition:transform .18s ease;
  }
  .patch:hover .go{ transform:translateX(3px); }

  /* ---------- PORTFOLIO GALLERY ---------- */
  .portfolio-section{ margin-top:6px; }

  .portfolio-title{
    font-family:'Sacramento', cursive;
    font-size:32px;
    text-align:center;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0 0 2px;
  }
  .portfolio-sub{
    text-align:center;
    font-size:12px;
    color:#8a8091;
    margin:0 0 20px;
  }

  .thumb-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }

  .thumb{
    position:relative;
    display:block;
    padding:0;
    border:none;
    border-radius:12px;
    overflow:hidden;
    aspect-ratio:1/1;
    cursor:pointer;
    background:var(--card);
    box-shadow:0 6px 16px -10px rgba(42,35,48,0.4);
    opacity:0;
    transform:scale(.85);
    animation:thumbIn .5s cubic-bezier(.22,1,.36,1) forwards;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  @keyframes thumbIn{ to{ opacity:1; transform:scale(1); } }

  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
  }
  .thumb:hover{ transform:scale(1.03); box-shadow:0 10px 22px -10px rgba(201,151,46,0.55); }
  .thumb:hover img{ transform:scale(1.08); }
  .thumb:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .thumb-cap{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:6px 8px 5px;
    font-family:'Fredoka', sans-serif;
    font-size:10px;
    font-weight:600;
    color:#fff;
    text-align:left;
    background:linear-gradient(0deg, rgba(0,0,0,.62), transparent);
    opacity:0;
    transition:opacity .18s ease;
  }
  .thumb:hover .thumb-cap, .thumb:focus-visible .thumb-cap{ opacity:1; }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,16,22,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease;
    z-index:50;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox img{
    max-width:100%;
    max-height:82vh;
    border-radius:14px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.6);
    transform:scale(.92);
    transition:transform .22s ease;
  }
  .lightbox.open img{ transform:scale(1); }
  .lightbox-close{
    position:absolute;
    top:18px; right:18px;
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-size:22px;
    line-height:1;
    cursor:pointer;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,0.22); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important; }
  }
</style>
</head>

      const src = document.getElementById('img-' + id).src;
